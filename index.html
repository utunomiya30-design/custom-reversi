<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="盤面サイズ、人数、勝利条件を変えて遊ぶカスタム・リバーシ。">
    <meta property="og:title" content="カスタム・リバーシ">
    <meta property="og:description" content="一瞬でカオスなリバーシが始まるURL。">
    <title>カスタム・リバーシ</title>
    <link rel="stylesheet" href="./styles.css?v=soft-bg-clear-20260517">
    <link rel="stylesheet" href="./top-art.css?v=title-art-hq-file-pos-20260517">
    <style>
      body::before {
        display: block;
        background-position: left 0 top 190px;
        background-size: min(900px, 84vw) auto;
        opacity: 0.68;
        filter: saturate(1.05) contrast(1.04);
      }

      @media (max-width: 820px) {
        body::before {
          background-position: left -52px top 124px;
          background-size: 760px auto;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section id="setup-view" class="view setup-view active">
        <div class="title-block">
          <p class="kicker">CUSTOM REVERSI</p>
          <h1 data-i18n="title">カスタム・リバーシ</h1>
          <p data-i18n="lead">人数、盤面、勝利条件を変えて、その場で遊べるローカル対戦版です。</p>
        </div>

        <form id="settings-form" class="settings-card">
          <div class="settings-grid">
            <label>
              <span data-i18n="language">Language</span>
              <select id="language-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="ko">한국어</option>
                <option value="zh">中文</option>
              </select>
            </label>
            <label>
              <span data-i18n="playerCount">参加人数</span>
              <select id="player-count">
                <option value="2">2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
              </select>
            </label>
            <label>
              <span data-i18n="boardSize">盤面サイズ</span>
              <select id="board-size">
                <option value="4">4 x 4</option>
                <option value="6">6 x 6</option>
                <option value="8" selected>8 x 8</option>
                <option value="12">12 x 12</option>
                <option value="16">16 x 16</option>
              </select>
            </label>
            <label>
              <span data-i18n="winMode">勝利条件</span>
              <select id="win-mode">
                <option value="classic">通常</option>
                <option value="reverse">逆転</option>
                <option value="score">スコア</option>
              </select>
            </label>
            <label>
              <span data-i18n="cornerBoost">角スタート</span>
              <select id="corner-boost">
                <option value="">なし</option>
                <option value="0">1P</option>
                <option value="1">2P</option>
                <option value="2">3P</option>
                <option value="3">4P</option>
              </select>
            </label>
            <label>
              <span data-i18n="cpuPlayers">CPUプレイヤー</span>
              <select id="cpu-players">
                <option value="">なし</option>
                <option value="1">2P</option>
                <option value="2">3P</option>
                <option value="3">4P</option>
                <option value="1,2">2P + 3P</option>
                <option value="1,2,3">2P + 3P + 4P</option>
              </select>
            </label>
            <label class="file-field">
              <span data-i18n="backgroundImage">背景画像</span>
              <input id="background-image" type="file" accept="image/png,image/jpeg">
            </label>
          </div>

          <div class="actions">
            <button type="submit" class="primary" data-i18n="startGame">ゲーム開始</button>
            <button type="button" id="share-rule" data-i18n="shareRule">このルールをシェア</button>
          </div>

          <section class="online-panel" aria-labelledby="online-title">
            <h2 id="online-title" data-i18n="onlineTitle">オンライン部屋</h2>
            <p data-i18n="onlineLead">部屋を作ってURLを共有すると、別タブや別ブラウザから参加できます。</p>
            <div class="online-controls">
              <button type="button" id="create-room" data-i18n="createRoom">部屋を作る</button>
              <label class="room-code-field">
                <span data-i18n="roomCode">部屋コード</span>
                <input id="room-code" type="text" autocomplete="off" inputmode="latin" placeholder="abcd1234">
              </label>
              <button type="button" id="join-room" data-i18n="joinRoom">参加する</button>
            </div>
            <p id="online-status" class="online-status" aria-live="polite"></p>
          </section>
        </form>
      </section>

      <section id="game-view" class="view game-view">
        <header class="game-header">
          <div>
            <p class="kicker" data-i18n="nowPlaying">NOW PLAYING</p>
            <h2 id="turn-label">1P のターン</h2>
          </div>
          <div id="score-board" class="score-board"></div>
        </header>

        <div class="board-wrap">
          <canvas id="game-board" width="640" height="640"></canvas>
        </div>

        <div class="actions game-actions">
          <button type="button" id="restart-game" data-i18n="restart">リノベーション</button>
          <button type="button" id="back-top" data-i18n="backTop">トップに戻る</button>
        </div>

        <div class="ad-slot" data-i18n="adBanner">広告枠</div>
      </section>

      <section id="result-view" class="view result-view">
        <div class="result-card">
          <p class="kicker" data-i18n="resultKicker">RESULT</p>
          <h2 data-i18n="resultTitle">結果発表</h2>
          <ol id="ranking-list"></ol>
          <div class="actions">
            <button type="button" id="share-result" class="primary" data-i18n="shareResult">この結果をSNSで自慢する</button>
            <button type="button" id="result-back-top" data-i18n="backTop">トップに戻る</button>
          </div>
          <div class="ad-slot large" data-i18n="adLarge">大型広告枠</div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js?v=20260517-online-1"></script>
  </body>
</html>
