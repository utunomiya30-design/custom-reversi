  <body>
    <main class="app-shell">
      <section class="top-panel" id="setupPanel" aria-label="ゲーム設定" data-i18n-aria="setupAria">
        <div class="title-block">
          <p class="kicker">Custom Reversi</p>
          <h1 data-i18n="appTitle">カスタム・リバーシ</h1>
          <p data-i18n="lead">人数、盤面、勝利条件を変えて、その場で遊べるローカル対戦版です。</p>
        </div>

        <form class="settings-grid" id="settingsForm">
          <label>
            <span data-i18n="languageLabel">Language</span>
            <select id="languageSelect">
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
              <option value="de">Deutsch</option>
              <option value="ko">한국어</option>
              <option value="zh">中文</option>
            </select>
          </label>

          <label>
            <span data-i18n="playersLabel">Players</span>
            <select id="playerCountSelect"></select>
          </label>

          <label>
            <span data-i18n="boardLabel">Board</span>
            <select id="boardSizeSelect">
              <option value="4">4 x 4</option>
              <option value="6">6 x 6</option>
              <option value="8" selected>8 x 8</option>
              <option value="12">12 x 12</option>
              <option value="16">16 x 16</option>
            </select>
          </label>

          <label>
            <span data-i18n="winModeLabel">Win mode</span>
            <select id="winModeSelect"></select>
          </label>

          <label>
            <span data-i18n="cornerBoostLabel">Corner boost</span>
            <select id="cornerBoostSelect"></select>
          </label>

          <label>
            <span data-i18n="cpuModeLabel">CPU players</span>
            <select id="cpuModeSelect"></select>
          </label>

          <label>
            <span data-i18n="backgroundLabel">Background</span>
            <input id="backgroundInput" type="file" accept="image/png,image/jpeg">
          </label>

          <div class="actions">
            <button type="submit" class="primary-button" data-i18n="startButton">ゲーム開始</button>
            <button type="button" id="shareRuleButton" data-i18n="shareRuleButton">このルールをシェア</button>
          </div>

          <div class="online-panel">
            <div>
              <strong data-i18n="onlineTitle">Online room</strong>
              <p data-i18n="onlineLead">Create a room and share the URL with another tab or browser.</p>
            </div>
            <div class="online-actions">
              <button type="button" id="createRoomButton" data-i18n="createRoomButton">Create room</button>
              <label class="room-code-field">
                <span data-i18n="roomCodeLabel">Room code</span>
                <input id="roomCodeInput" type="text" inputmode="latin" autocomplete="off" maxlength="12">
              </label>
              <button type="button" id="joinRoomButton" data-i18n="joinRoomButton">Join room</button>
            </div>
            <p class="online-status" id="onlineStatus" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="play-panel is-hidden" id="playPanel" aria-label="プレイ画面" data-i18n-aria="playAria">
        <header class="game-header">
          <div>
            <p class="kicker" data-i18n="nowPlaying">Now playing</p>
            <h2 id="turnLabel">1P のターン</h2>
            <p class="move-log" id="moveLog" aria-live="polite"></p>
            <p class="online-status" id="gameOnlineStatus" aria-live="polite"></p>
          </div>
          <div class="score-row" id="scoreRow" aria-live="polite"></div>
        </header>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="720" height="720" aria-label="リバーシ盤" data-i18n-aria="boardAria"></canvas>
        </div>

        <div class="play-actions">
          <button type="button" id="inviteButton" data-i18n="inviteButton">招待URLをコピー</button>
          <button type="button" id="restartButton" data-i18n="restartButton">リノベーション</button>
          <button type="button" id="backButton" data-i18n="backButton">トップに戻る</button>
        </div>

        <aside class="ad-slot" aria-label="広告枠" data-i18n-aria="adAria" data-i18n="adSlot">Advertisement</aside>
      </section>

      <section class="result-panel is-hidden" id="resultPanel" aria-label="結果画面" data-i18n-aria="resultAria">
        <div class="result-card">
          <p class="kicker" data-i18n="resultKicker">Result</p>
          <h2 data-i18n="finalResult">最終結果</h2>
          <ol id="rankingList"></ol>
          <div class="large-ad-slot" aria-label="広告枠" data-i18n-aria="adAria" data-i18n="largeAdSlot">Interstitial / Large Banner</div>
          <div class="result-actions">
            <button type="button" id="playAgainButton" onclick="document.getElementById('restartButton').click()">もう一度遊ぶ</button>
            <button type="button" id="resultBackButton" onclick="document.getElementById('playPanel').classList.add('is-hidden');document.getElementById('resultPanel').classList.add('is-hidden');document.getElementById('setupPanel').classList.remove('is-hidden')">トップに戻る</button>
            <button type="button" id="shareResultButton" class="primary-button" data-i18n="shareResultButton">この結果をSNSで自慢する</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js?v=colored-lighting-20260517"></script>
  </body>
</html>
