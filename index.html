<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="盤面サイズ、人数、勝利条件を変えて遊ぶカスタム・リバーシ。">
    <meta property="og:title" content="カスタム・リバーシ">
    <meta property="og:description" content="一瞬でカオスなリバーシが始まるURL。">
    <title>カスタム・リバーシ</title>
    <link rel="stylesheet" href="./styles.css?v=20260520-premium-1">
    <link rel="stylesheet" href="./top-art.css?v=20260520-premium-1">
    <link rel="stylesheet" href="./polish.css?v=20260520-premium-1">
    <link rel="stylesheet" href="./site-compliance.css?v=20260520-premium-1">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1361559686394936" crossorigin="anonymous"></script>
    <script>
      window.CUSTOM_REVERSI_ADS = {
        enabled: true,
        client: "ca-pub-1361559686394936",
        slots: {
          gameBanner: "8611620781",
          resultLarge: "5985457440",
        },
      };
    </script>
    <style>
      body::before {
        display: block;
        background-position: left 0 top 190px;
        background-size: min(900px, 84vw) auto;
        opacity: 0.68;
        filter: saturate(1.05) contrast(1.04);
      }

      @media (max-width: 820px) {
        body::before {
          background-position: left -52px top 124px;
          background-size: 760px auto;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="top-panel" id="setupPanel" aria-label="ゲーム設定" data-i18n-aria="setupAria">
        <div class="title-block">
          <p class="kicker">Custom Reversi</p>
          <h1 data-i18n="appTitle">カスタム・リバーシ</h1>
          <p data-i18n="lead">人数、盤面、勝利条件を変えて、その場で遊べるローカル対戦版です。</p>
        </div>

        <form class="settings-grid" id="settingsForm">
          <div class="setup-intro" id="setupIntro">
            盤面サイズ、人数、勝利条件を自由に変えて遊べるリバーシです。ランダムマッチでは先に待っている相手のルールに自動で合わせて、すぐにオンライン対戦できます。
          </div>

          <label>
            <span data-i18n="languageLabel">Language</span>
            <select id="languageSelect">
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
              <option value="de">Deutsch</option>
              <option value="ko">한국어</option>
              <option value="zh">中文</option>
            </select>
          </label>

          <label>
            <span data-i18n="playersLabel">参加人数</span>
            <select id="playerCountSelect"></select>
          </label>

          <label>
            <span data-i18n="boardLabel">盤面サイズ</span>
            <select id="boardSizeSelect">
              <option value="4">4 x 4</option>
              <option value="6">6 x 6</option>
              <option value="8" selected>8 x 8</option>
              <option value="12">12 x 12</option>
              <option value="16">16 x 16</option>
            </select>
          </label>

          <label>
            <span data-i18n="winModeLabel">勝利条件</span>
            <select id="winModeSelect"></select>
          </label>

          <label>
            <span data-i18n="cornerBoostLabel">角スタート</span>
            <select id="cornerBoostSelect"></select>
          </label>

          <label>
            <span data-i18n="cpuModeLabel">CPUプレイヤー</span>
            <select id="cpuModeSelect"></select>
          </label>

          <label>
            <span>あなたの名前</span>
            <input id="playerNameInput" type="text" maxlength="16" autocomplete="nickname" placeholder="例: おぎ">
          </label>

          <label>
            <span data-i18n="backgroundLabel">背景画像</span>
            <input id="backgroundInput" type="file" accept="image/png,image/jpeg">
          </label>

          <div class="actions">
            <button type="submit" class="primary-button" data-i18n="startButton">ゲーム開始</button>
            <button type="button" id="shareRuleButton" data-i18n="shareRuleButton">このルールをシェア</button>
          </div>

          <div class="online-panel">
            <div>
              <strong data-i18n="onlineTitle">オンライン部屋</strong>
              <p data-i18n="onlineLead">部屋を作ってURLを共有すると、別タブや別ブラウザから参加できます。</p>
            </div>
            <div class="online-actions">
              <button type="button" id="createRoomButton" data-i18n="createRoomButton">部屋を作る</button>
              <button type="button" id="randomMatchButton">ランダムマッチ</button>
              <label class="room-code-field">
                <span data-i18n="roomCodeLabel">部屋コード</span>
                <input id="roomCodeInput" type="text" inputmode="latin" autocomplete="off" maxlength="12">
              </label>
              <button type="button" id="joinRoomButton" data-i18n="joinRoomButton">参加する</button>
            </div>
            <p class="online-status" id="onlineStatus" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="play-panel is-hidden" id="playPanel" aria-label="プレイ画面" data-i18n-aria="playAria">
        <header class="game-header">
          <div>
            <p class="kicker" data-i18n="nowPlaying">Now playing</p>
            <h2 id="turnLabel">1P のターン</h2>
            <p class="move-log" id="moveLog" aria-live="polite"></p>
            <p class="online-status" id="gameOnlineStatus" aria-live="polite"></p>
          </div>
          <div class="score-row" id="scoreRow" aria-live="polite"></div>
        </header>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="720" height="720" aria-label="リバーシ盤" data-i18n-aria="boardAria"></canvas>
        </div>

        <div class="play-actions">
          <button type="button" id="inviteButton" data-i18n="inviteButton">招待URLをコピー</button>
          <button type="button" id="restartButton" data-i18n="restartButton">リノベーション</button>
          <button type="button" id="backButton" data-i18n="backButton">トップに戻る</button>
        </div>

        <aside class="ad-slot ad-slot-banner" aria-label="広告枠" data-i18n-aria="adAria" data-i18n="adSlot" data-ad-placement="game-banner">Advertisement</aside>
      </section>

      <section class="result-panel is-hidden" id="resultPanel" aria-label="結果画面" data-i18n-aria="resultAria">
        <div class="result-card">
          <p class="kicker" data-i18n="resultKicker">Result</p>
          <h2 data-i18n="finalResult">最終結果</h2>
          <ol id="rankingList"></ol>
          <div class="large-ad-slot ad-slot ad-slot-result" aria-label="大型広告枠" data-i18n-aria="adAria" data-i18n="largeAdSlot" data-ad-placement="result-large">Interstitial / Large Banner</div>
          <div class="result-actions">
            <button type="button" id="playAgainButton" data-i18n="playAgainButton">もう一度遊ぶ</button>
            <button type="button" id="resultBackButton" data-i18n="backButton">トップに戻る</button>
            <button type="button" id="shareResultButton" class="primary-button" data-i18n="shareResultButton">この結果をSNSで自慢する</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./site-compliance.js?v=20260519-adsense-1"></script>
    <script type="module" src="./src/app.js?v=20260521-sound-1"></script>
    <script type="module" src="./src/ads.js?v=20260520-premium-1"></script>
    <script type="module" src="./src/random-match.js?v=20260519-safe4p-1"></script>
    <script type="module" src="./src/online-reset.js?v=20260517-reset-1"></script>
    <script type="module" src="./src/fr-localization.js?v=20260517-locales-2"></script>
    <script type="module" src="./src/site-copy.js?v=20260517-intro-2"></script>
    <script type="module" src="./src/ui-polish.js?v=20260518-polish-3"></script>
    <script type="module" src="./src/ux-guide.js?v=20260518-guide-1"></script>
    <script type="module" src="./src/sound-effects.js?v=20260521-sound-1"></script>
    <script>
      (() => {
        const setupPanel = document.querySelector("#setupPanel");
        const playPanel = document.querySelector("#playPanel");
        const resultPanel = document.querySelector("#resultPanel");
        const settingsForm = document.querySelector("#settingsForm");
        const playAgainButton = document.querySelector("#playAgainButton");
        const resultBackButton = document.querySelector("#resultBackButton");

        playAgainButton?.addEventListener("click", () => {
          settingsForm?.requestSubmit();
        });

        resultBackButton?.addEventListener("click", () => {
          playPanel?.classList.add("is-hidden");
          resultPanel?.classList.add("is-hidden");
          setupPanel?.classList.remove("is-hidden");
        });
      })();
    </script>
  </body>
</html>
